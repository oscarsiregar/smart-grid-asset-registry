# Deploys main to the Azure VM: CI → build images → push to GHCR → update the
# VM through Azure Run Command (no SSH, no stored cloud secret: OIDC login).
#
# Repository variables (Settings → Secrets and variables → Actions → Variables):
#   AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID  OIDC app registration
#   AZURE_RESOURCE_GROUP, AZURE_VM_NAME                      the VM to update
#   SITE_ADDRESS                                             public host name, e.g. <label>.southeastasia.cloudapp.azure.com
# Setup steps: deploy/README.md.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time; a newer push waits instead of cancelling a running one.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    name: Build and push ${{ matrix.service }}
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - service: api
            context: backend
          - service: web
            context: frontend
    steps:
      - uses: actions/checkout@v5

      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/smart-grid-asset-registry-${{ matrix.service }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          # Same build arguments as the root docker-compose.yml "web" service;
          # the backend Dockerfile ignores them.
          build-args: |
            VITE_APP_NODE_ENV=production
            VITE_APP_API_ORIGIN_URL=/api
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    name: Deploy to Azure VM
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://${{ vars.SITE_ADDRESS }}
    permissions:
      contents: read
      id-token: write # OIDC login to Azure
      packages: read # the VM pulls the images with this job's token
    steps:
      - uses: actions/checkout@v5

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Run Command takes one script, so the settings and the two config files
      # are prepended to deploy/remote-deploy.sh. The GHCR token is this job's
      # GITHUB_TOKEN: read-only and expired when the job ends.
      - name: Assemble the remote script
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SITE_ADDRESS: ${{ vars.SITE_ADDRESS }}
        run: |
          {
            echo '#!/bin/sh'
            echo "IMAGE_PREFIX='ghcr.io/${GITHUB_REPOSITORY_OWNER,,}'"
            echo "IMAGE_TAG='${GITHUB_SHA}'"
            echo "SITE_ADDRESS='${SITE_ADDRESS}'"
            echo "GHCR_USER='${GITHUB_ACTOR}'"
            echo "GHCR_TOKEN='${GHCR_TOKEN}'"
            echo "COMPOSE_B64='$(base64 -w0 deploy/docker-compose.prod.yml)'"
            echo "CADDYFILE_B64='$(base64 -w0 deploy/Caddyfile)'"
            cat deploy/remote-deploy.sh
          } > "$RUNNER_TEMP/remote-deploy.sh"

      # Run Command reports the script's exit code only inside its output, so
      # the script ends with DEPLOY_OK and this step looks for it.
      - name: Update the VM
        run: |
          az vm run-command invoke \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ vars.AZURE_VM_NAME }}" \
            --command-id RunShellScript \
            --scripts @"$RUNNER_TEMP/remote-deploy.sh" \
            --query 'value[0].message' --output tsv | tee "$RUNNER_TEMP/remote-output.txt"
          grep -q 'DEPLOY_OK' "$RUNNER_TEMP/remote-output.txt"

      - name: Remove the remote script
        if: always()
        run: rm -f "$RUNNER_TEMP/remote-deploy.sh"

      - name: Smoke test
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS "https://${{ vars.SITE_ADDRESS }}/api/health"; then
              echo
              exit 0
            fi
            sleep 5
          done
          echo "https://${{ vars.SITE_ADDRESS }}/api/health did not answer"
          exit 1
