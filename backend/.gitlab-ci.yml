include:
  # Company build/deploy pipeline (image build, push to Harbor, deploy).
  # Adjust ref/file to whatever the Infra team currently publishes.
  - project: Infra/supply-chain
    ref: feat/create-pipeline
    file: template/tanzu_template.yml

lint:
  stage: lint
  image: golangci/golangci-lint:v2.13.2
  script:
    # 10m: loading every package from a cold module cache can exceed 5m.
    - golangci-lint run --timeout=10m
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

go_test:
  stage: test
  image: golang:1.26.9-alpine
  # A transient image-pull hiccup shouldn't need a human to click retry.
  retry: 2
  script:
    - test -z "$(gofmt -l .)" || (echo "gofmt needed on:" && gofmt -l . && exit 1)
    - go vet ./...
    # Excludes wiring (cmd, bootstrap, routes), generated mocks, and
    # declaration-only packages (no logic to test).
    - go test $(go list ./... | grep -vE '^smart-grid-asset-registry/(cmd(/.*)?|internal/bootstrap$|internal/routes$|internal/mocks(/.*)?|internal/repository/psql/model$|domain/(repository|service|dto|entity|errorcode)$)')
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

# internal/usecase coverage: 80% target. Non-blocking on feature branches,
# a hard gate on main/staging.
coverage_check:
  stage: test
  image: golang:1.26.9-alpine
  script:
    - go test ./internal/usecase/... -coverprofile=coverage.out
    - go tool cover -func=coverage.out
    - |
      PCT=$(go tool cover -func=coverage.out | tail -1 | awk '{print $3}' | tr -d '%')
      echo "internal/usecase coverage: ${PCT}%"
      awk -v pct="$PCT" 'BEGIN { if (pct+0 < 80) { print "below the 80% target"; exit 1 } print "meets the 80% target" }'
  coverage: '/^internal\/usecase coverage: (\d+\.\d+)%$/'
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^(main|staging)$/'
      allow_failure: false
    - if: $CI_COMMIT_BRANCH
      allow_failure: true
