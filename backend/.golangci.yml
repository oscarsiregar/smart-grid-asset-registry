version: "2"

run:
  timeout: 10m

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose     # unclosed http.Response bodies (outbound service clients)
    - errorlint     # errors.Is/As instead of == on wrapped errors
    - gosec         # security smells (SQL string building, weak crypto, ...)
    - misspell
    - nilerr        # returning nil when err != nil
    - noctx         # outbound HTTP requests without context
    - revive
    - unconvert
  settings:
    revive:
      rules:
        # package names like asset_import_usecase are an intentional convention
        - name: var-naming
          disabled: true
  exclusions:
    generated: lax
    paths:
      - internal/mocks
    rules:
      # fiber's app.Test responses and httptest requests in tests
      - path: _test\.go
        linters:
          - gosec
          - errcheck
          - bodyclose
          - noctx

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - smart-grid-asset-registry
