#cloud-config
# First boot of the Azure VM (Ubuntu 24.04, 1 GB memory): Docker with the Compose
# plugin, and a 2 GB swap file because the VM has only 1 GB of memory.
# The app itself arrives with the first run of the deploy workflow.

package_update: true
package_upgrade: true
packages:
  - docker.io
  - docker-compose-v2
  - unattended-upgrades

runcmd:
  - fallocate -l 2G /swapfile
  - chmod 600 /swapfile
  - mkswap /swapfile
  - swapon /swapfile
  - echo '/swapfile none swap sw 0 0' >> /etc/fstab
  - systemctl enable --now docker
  - mkdir -p /opt/smart-grid
