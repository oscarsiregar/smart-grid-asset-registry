# Runs the app: docker compose up --build
#   db (5432), api (8080), web (3000)
# Runs the tests: docker compose --profile test run --rm backend-test (or frontend-test)
# Override a host port with DB_HOST_PORT, API_HOST_PORT or WEB_HOST_PORT if it is taken.
# The credentials are fixed local-development values, not secrets.

name: smart-grid-asset-registry

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: asset_registry
    ports:
      - "${DB_HOST_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      # Over TCP, so it waits for the real server rather than the image's
      # temporary first-start one.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d asset_registry"]
      interval: 2s
      timeout: 5s
      retries: 30

  api:
    build: ./backend
    environment:
      APP_NAME: smart-grid-asset-registry
      APP_ENV: dev
      APP_HOST: 0.0.0.0
      APP_PORT: "8080"
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: asset_registry
    ports:
      - "${API_HOST_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/api/health"]
      interval: 3s
      timeout: 5s
      retries: 20

  web:
    build:
      context: ./frontend
      args:
        VITE_APP_NODE_ENV: production
        VITE_APP_API_ORIGIN_URL: /api
    ports:
      - "${WEB_HOST_PORT:-3000}:80"
    depends_on:
      api:
        condition: service_healthy

  backend-test:
    profiles: ["test"]
    image: golang:1.26.9
    working_dir: /src
    command: go test ./...
    volumes:
      - ./backend:/src

  frontend-test:
    profiles: ["test"]
    image: node:24.19.0
    working_dir: /app
    command: sh -c "corepack enable && pnpm install --frozen-lockfile && pnpm test"
    environment:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  db-data:
